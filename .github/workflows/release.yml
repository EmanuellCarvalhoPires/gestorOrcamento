name: Build & Publish Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows App
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Production Environment
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DATABASE: ${{ secrets.PG_DATABASE }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-1023898773119-enta4pjoekg51vlbbvrhgi8i0e7f71eq.apps.googleusercontent.com}" >> .env
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env; fi
          if [ -n "$SMTP_HOST" ]; then echo "SMTP_HOST=$SMTP_HOST" >> .env; fi
          if [ -n "$SMTP_PORT" ]; then echo "SMTP_PORT=$SMTP_PORT" >> .env; fi
          if [ -n "$SMTP_USER" ]; then echo "SMTP_USER=$SMTP_USER" >> .env; fi
          if [ -n "$SMTP_PASS" ]; then echo "SMTP_PASS=$SMTP_PASS" >> .env; fi
          if [ -n "$PG_HOST" ]; then echo "PG_HOST=$PG_HOST" >> .env; fi
          if [ -n "$PG_PORT" ]; then echo "PG_PORT=$PG_PORT" >> .env; fi
          if [ -n "$PG_DATABASE" ]; then echo "PG_DATABASE=$PG_DATABASE" >> .env; fi
          if [ -n "$PG_USER" ]; then echo "PG_USER=$PG_USER" >> .env; fi
          if [ -n "$PG_PASSWORD" ]; then echo "PG_PASSWORD=$PG_PASSWORD" >> .env; fi

      - name: Build Electron App Bundles
        run: npm run build

      - name: Build and Package Windows App
        run: npx electron-builder --config electron-builder.json --publish never

      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "version=v$APP_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Simple Finances ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Simple Finances - Versão ${{ steps.get_version.outputs.version }}

            Nova versão estável do **Simple Finances** para Windows.

            ### 📦 Como Instalar / Atualizar:
            * **Primeira instalação:** Baixe o instalador executável (`.exe`) listado abaixo nos Assets e execute-o.
            * **Já possui o app instalado:** O aplicativo identificará esta versão e atualizará automaticamente em 1 clique!

            ---
            ✨ *Compilado e distribuído automaticamente via GitHub Actions.*
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist_installer/*.exe
            dist_installer/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
